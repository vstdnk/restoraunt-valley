<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover — чтобы дотянуться до вырезов через env(safe-area-inset-*).
      user-scalable=no + maximum-scale=1 — в Telegram WebView двойной тап иначе
      зумит страницу прямо посреди перетаскивания мебели.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0f141b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Restaurant Valley</title>
    <script src="https://telegram.org/js/telegram-web-app.js?57"></script>
    <style>
      /*
       * Базовый слой под Mini App. Всё остальное оформление — Tailwind, но эти
       * правила должны действовать до загрузки бандла, иначе первый кадр
       * успевает показать белый фон и дать себя проскроллить.
       */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f141b;
        color: #e8eef6;
        /* Телеграм закрывает мини-апп свайпом вниз: гасим и bounce, и pull-to-close. */
        overscroll-behavior: none;
        overflow: hidden;
        /*
         * manipulation убирает двойной тап-зум, но оставляет скролл — он нужен
         * спискам в каталоге и панели сотрудников. Канвасу touch-action: none
         * ставит сам PixiJS, там жесты наши.
         */
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        /* Долгое нажатие на iOS иначе показывает меню «Скопировать / Поделиться». */
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        height: 100%;
      }
      /* Заставка на время загрузки бандла и модели аватара. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        gap: 12px;
        align-content: center;
        background: #0f141b;
        transition: opacity 0.25s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot .ring {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #f0b23a;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      #boot .label {
        font-size: 13px;
        opacity: 0.6;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring {
          animation-duration: 3s;
        }
      }
    </style>
    <script type="module" crossorigin src="/restoraunt-valley/assets/index-MoWCbMIL.js"></script>
    <link rel="modulepreload" crossorigin href="/restoraunt-valley/assets/react-VKYPKYN3.js">
    <link rel="modulepreload" crossorigin href="/restoraunt-valley/assets/three-jQUg3jnV.js">
    <link rel="modulepreload" crossorigin href="/restoraunt-valley/assets/pixi-DLSZSldy.js">
    <link rel="stylesheet" crossorigin href="/restoraunt-valley/assets/index-m3JcrvqZ.css">
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="ring"></div><div class="label">Открываем ресторан…</div></div>
  </body>
</html>
